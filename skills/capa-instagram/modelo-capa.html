<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=block">
<style>
/* Troque SÓ o :root pelos valores de _contexto/marca.md.
   Tamanho da página: 1080x1920 (Reels) ou 1280x720 (YouTube): ajuste --largura/--altura
   e o mesmo valor no --tamanho do gerar_png.py. */
:root {
  --largura: 1080px; --altura: 1920px;
  --fundo: #1F3A5F;            /* capa escura: cor principal; capa clara: o fundo claro da marca */
  --texto: #FFFFFF;
  --destaque: #B08D57;
  --fonte-titulo: "Playfair Display", Georgia, serif;
  --fonte-texto: "Inter", "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: var(--largura); height: var(--altura); overflow: hidden; background: var(--fundo); }
.capa { width: var(--largura); height: var(--altura); position: relative; overflow: hidden;
  color: var(--texto); font-family: var(--fonte-texto);
  display: flex; flex-direction: column; justify-content: center; padding: 0 100px; }
/* Reels: o perfil mostra a capa cortada em 3:4 (de y=240 a y=1680). Tudo que importa fica
   na .zona, centralizada; nada importante no rodapé, onde o Instagram põe o contador. */
.zona { display: flex; flex-direction: column; gap: 48px; }
.faixa { width: 120px; height: 10px; background: var(--destaque); }
h1 { font-family: var(--fonte-titulo); font-size: 150px; line-height: 1.04; letter-spacing: -0.015em; text-wrap: balance; }
.sub { font-size: 50px; line-height: 1.3; opacity: .92; max-width: 860px; }
.marca { display: flex; align-items: center; gap: 22px; font-size: 32px; opacity: .85; }
.marca img { height: 72px; width: auto; }
/* YouTube 1280x720: título menor, mesma ordem */
.paisagem { padding: 0 90px; }
.paisagem .zona { gap: 28px; }
.paisagem h1 { font-size: 96px; }
.paisagem .sub { font-size: 36px; }
.estourou { position: fixed; inset: 0 0 auto 0; background: #D00; color: #fff; font: 700 40px Arial; padding: 24px; text-align: center; }
</style>
</head>
<body>
<main class="capa">
  <div class="zona">
    <div class="faixa"></div>
    <h1>A pergunta do cliente, em até 7 palavras</h1>
    <p class="sub">Uma frase que completa o título.</p>
    <div class="marca"><!-- <img src="logo.png" alt=""> --><span>Nome do Escritório · OAB/UF 000.000</span></div>
  </div>
</main>
<script>
addEventListener("load", () => {
  const c = document.querySelector(".capa"), z = document.querySelector(".zona");
  const r = z.getBoundingClientRect(), alto = c.clientHeight > c.clientWidth;
  const fora = c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1 ||
    (alto && (r.top < 300 || r.bottom > 1620));   // fora do corte 3:4 da grade do perfil
  if (fora) document.body.insertAdjacentHTML("beforeend", '<div class="estourou">NÃO COUBE NA ÁREA SEGURA: encurte o texto</div>');
});
</script>
</body>
</html>
